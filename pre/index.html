<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Só um instante…</title>

  <!-- Pré-carrega a página de destino para o redirecionamento ficar instantâneo -->
  <link rel="prefetch" href="https://mercadolivre.black-friday.br.com/busca/cat-natal.html">

  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0ea5e9;
      --primary-hover: #0284c7;
      --success: #10b981;
      --radius: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --card: #111827;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #1f2937;
      }
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body { height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    /* Ícone de status */
    .status {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      position: relative;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      animation: spin 0.9s linear infinite;
    }

    .check {
      display: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--success);
      align-items: center;
      justify-content: center;
      animation: pop 0.3s ease-out;
    }

    .check svg { width: 28px; height: 28px; }

    .done .spinner { display: none; }
    .done .check { display: flex; }

    h1 {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .description {
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 24px;
      min-height: 22px;
    }

    /* Barra de progresso */
    .progress {
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--primary);
      border-radius: 999px;
      transition: width 2s ease-out;
    }

    .continue-btn {
      width: 100%;
      border: none;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease, opacity 0.3s ease;
    }

    .continue-btn:hover:not(:disabled) { background: var(--primary-hover); }
    .continue-btn:active:not(:disabled) { transform: scale(0.98); }

    .continue-btn:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .continue-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .fallback {
      display: inline-block;
      margin-top: 16px;
      font-size: 14px;
      color: var(--primary);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* Respeita quem prefere menos animação */
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.5s; }
      .check { animation: none; }
      .progress-bar { transition: none; }
    }
  </style>
</head>

<body>
  <main class="card" id="card">
    <div class="status" aria-hidden="true">
      <div class="spinner"></div>
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
    </div>

    <h1 id="title">Carregando…</h1>

    <p class="description" id="description" aria-live="polite">
      Aguarde alguns segundos.
    </p>

    <div class="progress" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <button class="continue-btn" id="continueBtn" type="button" disabled>
      Aguarde…
    </button>

    <!-- Se o JavaScript estiver desativado, o visitante não fica preso -->
    <noscript>
      <a class="fallback" href="https://mercadolivre.black-friday.br.com/busca/cat-natal.html">Clique aqui para continuar</a>
    </noscript>
  </main>

  <script>
    (function () {
      var DESTINO = "https://mercadolivre.black-friday.br.com/busca/cat-natal.html";
      var ESPERA_MS = 2000;

      var card = document.getElementById("card");
      var title = document.getElementById("title");
      var description = document.getElementById("description");
      var bar = document.getElementById("progressBar");
      var btn = document.getElementById("continueBtn");

      // Mantém UTMs, gclid, fbclid etc. ao redirecionar
      function urlDestino() {
        var url = new URL(DESTINO, window.location.href);
        var params = new URLSearchParams(window.location.search);
        params.forEach(function (valor, chave) {
          if (!url.searchParams.has(chave)) url.searchParams.set(chave, valor);
        });
        if (window.location.hash) url.hash = window.location.hash;
        return url.toString();
      }

      // Inicia a barra de progresso
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { bar.style.width = "100%"; });
      });

      setTimeout(function () {
        card.classList.add("done");
        title.textContent = "Tudo pronto!";
        description.textContent = "Clique no botão abaixo para continuar.";
        btn.disabled = false;
        btn.textContent = "Continuar";
        btn.focus({ preventScroll: true });
      }, ESPERA_MS);

      btn.addEventListener("click", function () {
        if (btn.disabled) return;
        btn.disabled = true;
        btn.textContent = "Abrindo…";
        window.location.href = urlDestino();
      });
    })();
  </script>
